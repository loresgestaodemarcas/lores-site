name: keepalive

# Mantem o servico do Render (plano gratuito) acordado, evitando o cold start
# de ~40s que fazia a primeira mensagem do WhatsApp se perder.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no /health do bot
        run: |
          URL="https://lores-whatsapp-bot.onrender.com/health"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo 000)
            echo "tentativa $i - HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "O servico nao respondeu 200 apos 3 tentativas."
          exit 1
